<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #071e14; }
      .grid { stroke: rgba(212, 175, 55, 0.12); stroke-width: 1; }
      .wall { stroke: #d4af37; stroke-width: 4; fill: rgba(14, 61, 41, 0.6); }
      .inner-wall { stroke: #c5a059; stroke-width: 2.5; fill: none; }
      .door { stroke: #ffd700; stroke-width: 1.5; fill: none; stroke-dasharray: 4,2; }
      .window { stroke: #6ee7b7; stroke-width: 3; }
      .text-room { font-family: 'Prompt', sans-serif; font-size: 15px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .text-dim { font-family: 'Prompt', sans-serif; font-size: 12px; fill: #a7f3d0; text-anchor: middle; }
      .text-title { font-family: 'Prompt', sans-serif; font-size: 20px; font-weight: 700; fill: #ffd700; letter-spacing: 1px; }
      .text-sub { font-family: 'Prompt', sans-serif; font-size: 13px; fill: #cbd5e1; }
      .car-slot { stroke: #d4af37; stroke-dasharray: 6,4; fill: rgba(20, 83, 56, 0.3); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" class="bg"/>

  <!-- Blueprint Grid -->
  <g class="grid">
    <line x1="50" y1="50" x2="750" y2="50"/>
    <line x1="50" y1="150" x2="750" y2="150"/>
    <line x1="50" y1="250" x2="750" y2="250"/>
    <line x1="50" y1="350" x2="750" y2="350"/>
    <line x1="50" y1="450" x2="750" y2="450"/>
    <line x1="150" y1="50" x2="150" y2="500"/>
    <line x1="300" y1="50" x2="300" y2="500"/>
    <line x1="450" y1="50" x2="450" y2="500"/>
    <line x1="600" y1="50" x2="600" y2="500"/>
  </g>

  <!-- Header Blueprint Info -->
  <text x="60" y="45" class="text-title">RM-NORDIC GRAND • แปลนชั้น 1 (1ST FLOOR PLAN)</text>
  <text x="60" y="68" class="text-sub">สัดส่วนพื้นที่ 135 ตร.ม. • โถงรับแขกเพดานสูง • ครัวเปิดสไตล์ยุโรป • ที่จอดรถ EV 2 คัน</text>

  <!-- Outer Walls / Building Envelope -->
  <!-- Carport (Left) -->
  <rect x="70" y="120" width="220" height="340" class="car-slot" rx="8"/>
  <text x="180" y="270" class="text-room">🚗 ที่จอดรถ 2 คัน (EV CHARGER)</text>
  <text x="180" y="295" class="text-dim">5.50 x 6.00 ม.</text>

  <!-- Main House Boundary -->
  <rect x="290" y="100" width="440" height="380" class="wall" rx="4"/>

  <!-- Foyer & Grand Living Room -->
  <rect x="290" y="100" width="260" height="230" class="inner-wall"/>
  <text x="420" y="195" class="text-room">🛋️ GRAND LIVING &amp; FOYER</text>
  <text x="420" y="220" class="text-dim">โถงรับแขกเพดานสูงโปรง 3.2 ม. (5.20 x 4.80 ม.)</text>

  <!-- Dining & Kitchen Area (Right Side) -->
  <rect x="550" y="100" width="180" height="230" class="inner-wall"/>
  <text x="640" y="185" class="text-room">🍽️ DINING &amp; KITCHEN</text>
  <text x="640" y="210" class="text-dim">ครัวยุโรป + ไอส์แลนด์</text>
  <text x="640" y="230" class="text-dim">(3.60 x 4.80 ม.)</text>

  <!-- Guest Bedroom (Bottom Left inside house) -->
  <rect x="290" y="330" width="220" height="150" class="inner-wall"/>
  <text x="400" y="395" class="text-room">🛏️ BEDROOM 3 / ห้องผู้สูงอายุ</text>
  <text x="400" y="420" class="text-dim">วิวสวนหน้าบ้าน (4.40 x 3.20 ม.)</text>

  <!-- Bathroom & Laundry (Bottom Right) -->
  <rect x="510" y="330" width="110" height="150" class="inner-wall"/>
  <text x="565" y="395" class="text-room">🚿 ห้องน้ำ 1</text>
  <text x="565" y="420" class="text-dim">2.20 x 3.00 ม.</text>

  <!-- Terrace / Garden Deck -->
  <rect x="620" y="330" width="110" height="150" class="inner-wall" style="stroke-dasharray:4,3;"/>
  <text x="675" y="395" class="text-room">🌿 ระเบียงสวน</text>
  <text x="675" y="420" class="text-dim">OUTDOOR</text>

  <!-- Windows -->
  <line x1="340" y1="100" x2="480" y2="100" class="window"/>
  <line x1="580" y1="100" x2="700" y2="100" class="window"/>
  <line x1="730" y1="140" x2="730" y2="240" class="window"/>
  <line x1="330" y1="480" x2="450" y2="480" class="window"/>

  <!-- Compass & Scale Footer -->
  <circle cx="100" cy="505" r="20" stroke="#d4af37" fill="none" stroke-width="1.5"/>
  <text x="100" y="500" font-size="11" fill="#ffd700" text-anchor="middle" font-weight="700">N</text>
  <line x1="100" y1="510" x2="100" y2="490" stroke="#ffd700" stroke-width="2"/>
  <text x="135" y="510" class="text-dim" style="text-anchor:start;">SCALE 1:100 • RMHOME ENGINEERING CERTIFIED</text>
</svg>
