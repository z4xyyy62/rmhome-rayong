<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #071e14; }
      .grid { stroke: rgba(212, 175, 55, 0.12); stroke-width: 1; }
      .wall { stroke: #d4af37; stroke-width: 4; fill: rgba(14, 61, 41, 0.6); }
      .inner-wall { stroke: #c5a059; stroke-width: 2.5; fill: none; }
      .window { stroke: #6ee7b7; stroke-width: 3; }
      .text-room { font-family: 'Prompt', sans-serif; font-size: 15px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .text-dim { font-family: 'Prompt', sans-serif; font-size: 12px; fill: #a7f3d0; text-anchor: middle; }
      .text-title { font-family: 'Prompt', sans-serif; font-size: 20px; font-weight: 700; fill: #ffd700; letter-spacing: 1px; }
      .text-sub { font-family: 'Prompt', sans-serif; font-size: 13px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="800" height="550" class="bg"/>

  <!-- Blueprint Grid -->
  <g class="grid">
    <line x1="50" y1="50" x2="750" y2="50"/>
    <line x1="50" y1="150" x2="750" y2="150"/>
    <line x1="50" y1="250" x2="750" y2="250"/>
    <line x1="50" y1="350" x2="750" y2="350"/>
    <line x1="50" y1="450" x2="750" y2="450"/>
    <line x1="150" y1="50" x2="150" y2="500"/>
    <line x1="300" y1="50" x2="300" y2="500"/>
    <line x1="450" y1="50" x2="450" y2="500"/>
    <line x1="600" y1="50" x2="600" y2="500"/>
  </g>

  <!-- Header Blueprint Info -->
  <text x="60" y="45" class="text-title">RM-NORDIC GRAND • แปลนชั้น 2 (2ND FLOOR PLAN)</text>
  <text x="60" y="68" class="text-sub">สัดส่วนพื้นที่ 110 ตร.ม. • Master Bedroom พร้อม Walk-in Closet • ระเบียงจั่วกระจกทรงสูง</text>

  <!-- Outer Walls / Building Envelope -->
  <rect x="180" y="100" width="550" height="380" class="wall" rx="4"/>

  <!-- Master Bedroom Suite (Left Half) -->
  <rect x="180" y="100" width="310" height="250" class="inner-wall"/>
  <text x="335" y="195" class="text-room">👑 MASTER BEDROOM SUITE</text>
  <text x="335" y="220" class="text-dim">ห้องนอนใหญ่เพดานทรงจั่ว (5.50 x 4.80 ม.)</text>
  <text x="335" y="240" class="text-dim">Walk-in Closet &amp; ห้องน้ำส่วนตัว</text>

  <!-- Master Bath & Closet -->
  <rect x="180" y="350" width="160" height="130" class="inner-wall"/>
  <text x="260" y="405" class="text-room">🛁 MASTER BATH</text>
  <text x="260" y="425" class="text-dim">อ่างอาบน้ำ &amp; สุขภัณฑ์พรีเมียม</text>

  <!-- Balcony (Front Left) -->
  <rect x="340" y="350" width="150" height="130" class="inner-wall" style="stroke-dasharray:4,3;"/>
  <text x="415" y="405" class="text-room">🌅 SKY BALCONY</text>
  <text x="415" y="425" class="text-dim">ระเบียงชมวิวหน้าบ้าน</text>

  <!-- Bedroom 2 (Top Right) -->
  <rect x="490" y="100" width="240" height="200" class="inner-wall"/>
  <text x="610" y="190" class="text-room">🛏️ BEDROOM 2</text>
  <text x="610" y="215" class="text-dim">ห้องนอนลูกวิวสวน (4.20 x 4.00 ม.)</text>

  <!-- Family Living / Home Theater & Bath 3 (Bottom Right) -->
  <rect x="490" y="300" width="140" height="180" class="inner-wall"/>
  <text x="560" y="385" class="text-room">🍿 FAMILY LOUNGE</text>
  <text x="560" y="405" class="text-dim">โถงพักผ่อนชั้นบน</text>

  <rect x="630" y="300" width="100" height="180" class="inner-wall"/>
  <text x="680" y="385" class="text-room">🚿 BATH 2</text>
  <text x="680" y="405" class="text-dim">ส่วนกลาง</text>

  <!-- Windows -->
  <line x1="220" y1="100" x2="420" y2="100" class="window"/>
  <line x1="530" y1="100" x2="690" y2="100" class="window"/>
  <line x1="730" y1="140" x2="730" y2="240" class="window"/>

  <!-- Compass & Scale Footer -->
  <circle cx="100" cy="505" r="20" stroke="#d4af37" fill="none" stroke-width="1.5"/>
  <text x="100" y="500" font-size="11" fill="#ffd700" text-anchor="middle" font-weight="700">N</text>
  <line x1="100" y1="510" x2="100" y2="490" stroke="#ffd700" stroke-width="2"/>
  <text x="135" y="510" class="text-dim" style="text-anchor:start;">SCALE 1:100 • ARCHITECTURAL DESIGN BY RMHOME</text>
</svg>

